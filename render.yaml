databases:
  # Paid instance — free Postgres expires 30 days after creation and is then
  # deleted after a 14-day grace period, taking all merchant data with it.
  # Change this value to match whatever plan is selected in the dashboard, or
  # a blueprint sync will try to move the database back.
  - name: cowrie-db
    plan: basic-1gb
    databaseName: cowrie
    user: cowrie

services:
  - type: web
    name: cowrie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cowrie-db
          property: connectionString
      - key: COWRIE_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://cowrie-gateway.onrender.com

      # Admin login credentials (set in Render dashboard)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Email — Resend is preferred (higher limits); Gmail is fallback
      # If RESEND_API_KEY is set, GMAIL_* are ignored
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: KassifyPay <onboarding@resend.dev>
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

      # Cloudinary — for KYC document storage (keeps DB size small)
      # Sign up free at cloudinary.com, then set these three values
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # MCASH (app.arkmah.com) — primary gateway. With no keys set, payments
      # run through the static pay-link (manual confirmation); the API key
      # pair upgrades to hosted checkout with automatic confirmation.
      - key: MCASH_PAYLINK_URL
        value: https://app.arkmah.com/pay-link/ucauuiujzvfi
      - key: MCASH_PUBLIC_KEY
        sync: false
      - key: MCASH_SECRET_KEY
        sync: false
      - key: MCASH_TEST_PUBLIC_KEY
        sync: false
      - key: MCASH_TEST_SECRET_KEY
        sync: false

      # Nalopay — fallback gateway, used only when MCASH is not configured.
      - key: NALOPAY_MERCHANT_ID
        sync: false
      - key: NALOPAY_BASIC_AUTH
        sync: false
      - key: NALOPAY_SECRET_KEY
        sync: false
