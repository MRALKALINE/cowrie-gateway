<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KassifyPay Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ─── Tokens (dark) ─── */
:root{
  --ivory:#071318; --ivory-2:#0B1B21; --white:#061116;
  --ink:#E4EEF0; --ink-soft:rgba(228,238,240,.65); --muted:rgba(228,238,240,.4); --faint:rgba(228,238,240,.22);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.06);
  --plum:#0C6E77; --plum-deep:#06424A; --plum-br:#3FC7D4; --plum-tint:rgba(12,110,119,.28);
  --gold:#E0A12E; --gold-deep:#C8901A; --gold-tint:rgba(224,161,46,.22);
  --mint:#1FA877; --mint-tint:rgba(31,168,119,.2); --coral:#EF6A4C; --coral-tint:rgba(239,106,76,.18);
  --display:'Plus Jakarta Sans',sans-serif; --body:'Plus Jakarta Sans',sans-serif; --mono:'JetBrains Mono',monospace;
}

/* ─── Reset ─── */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#050E12;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.5;
  min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  position:relative;overflow-x:hidden;
}
::selection{background:var(--plum);color:#fff}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ─── Background scene ─── */
.bg-scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-grid{
  position:absolute;left:-40%;right:-40%;bottom:-5%;height:75%;
  background-image:linear-gradient(rgba(12,110,119,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(12,110,119,.22) 1px,transparent 1px);
  background-size:70px 70px;
  transform:perspective(550px) rotateX(58deg);transform-origin:center bottom;
  animation:gridScroll 10s linear infinite;
  mask-image:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.4) 55%,transparent 100%);
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.4) 55%,transparent 100%);
}
@keyframes gridScroll{from{background-position:0 0}to{background-position:0 70px}}
.bg-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.orb-1{width:600px;height:600px;top:-200px;left:-200px;background:radial-gradient(circle,rgba(12,110,119,.4),transparent 65%);animation:drift1 28s ease-in-out infinite}
.orb-2{width:500px;height:500px;bottom:-200px;right:-100px;background:radial-gradient(circle,rgba(200,134,10,.2),transparent 65%);animation:drift2 33s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,28px)}}

/* ─── Brand shell ─── */
.shell{width:22px;height:22px;border-radius:50% 50% 48% 48%/60% 60% 40% 40%;background:linear-gradient(135deg,var(--gold),var(--plum-br));position:relative;box-shadow:inset 0 -2px 4px rgba(0,0,0,.3),0 0 12px rgba(224,161,46,.2);flex-shrink:0}
.shell::before{content:'';position:absolute;left:50%;top:18%;bottom:18%;width:2px;background:rgba(255,255,255,.7);transform:translateX(-50%);border-radius:2px}

/* ─── Checkout card ─── */
.checkout{
  position:relative;z-index:1;width:min(94vw,440px);
  background:rgba(7,19,24,.82);
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 1px rgba(12,110,119,.08) inset,0 2px 0 rgba(255,255,255,.05) inset;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  overflow:hidden;
}

/* ─── Header ─── */
.co-head{padding:20px 22px 18px;border-bottom:1px solid var(--line-2);position:relative}
.co-merch{display:flex;align-items:center;gap:11px}
.co-merch .av{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--plum),var(--plum-br));display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--display);font-size:17px;box-shadow:0 4px 14px rgba(12,110,119,.35)}
.co-merch .nm{font-weight:700;font-size:15px;color:var(--ink)}
.co-merch .url{font-family:var(--mono);font-size:11px;color:var(--muted)}
.co-timer{position:absolute;top:20px;right:22px;font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);padding:4px 9px;border-radius:7px;backdrop-filter:blur(8px)}
.co-amt{margin-top:16px;display:flex;align-items:baseline;gap:8px}
.co-amt .l{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.co-amt .v{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin-left:auto;background:linear-gradient(135deg,#fff,rgba(255,255,255,.7));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ─── Test badge ─── */
.testbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--gold);background:rgba(224,161,46,.14);border:1px solid rgba(224,161,46,.28);padding:3px 8px;border-radius:6px;margin-top:14px}

/* ─── Method tabs ─── */
.co-body{padding:18px 22px 22px}
.methods{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:18px}
.mtab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border:1.5px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);transition:.18s;font-size:11px;font-weight:600;color:var(--muted)}
.mtab:hover{border-color:rgba(12,110,119,.4);background:rgba(255,255,255,.07);color:var(--ink-soft)}
.mtab.on{border-color:rgba(12,110,119,.55);background:rgba(12,110,119,.2);color:#8FE3EC;box-shadow:0 0 16px rgba(12,110,119,.2)}
.mtab .mi{width:24px;height:24px}.mtab .mi svg{width:22px;height:22px}

/* ─── Form fields ─── */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink-soft)}
.inp-wrap{position:relative}
.field input,.field select{
  width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;font-family:var(--body);font-size:14.5px;
  color:var(--ink);outline:none;transition:.18s;
}
.field input.mono{font-family:var(--mono);letter-spacing:.04em}
.field input::placeholder{color:var(--faint)}
.field select option{background:#0A1D24;color:var(--ink)}
.field input:focus,.field select:focus{border-color:rgba(12,110,119,.6);box-shadow:0 0 0 4px rgba(12,110,119,.18);background:rgba(255,255,255,.08)}
.field input.bad{border-color:rgba(239,106,76,.6);box-shadow:0 0 0 4px rgba(239,106,76,.12)}
.err{color:var(--coral);font-size:11.5px;margin-top:5px;display:none}.err.show{display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{border:1.5px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:10px 4px;font-size:12px;font-weight:600;color:var(--muted);transition:.18s}
.seg button:hover{border-color:rgba(12,110,119,.35);color:var(--ink-soft)}
.seg button.on{border-color:rgba(12,110,119,.55);background:rgba(12,110,119,.2);color:#8FE3EC}
.hint{font-size:11.5px;color:var(--muted);margin:2px 0 12px;display:flex;align-items:center;gap:6px}
.hint b{color:var(--ink-soft);font-family:var(--mono)}

/* ─── Pay button ─── */
.pay{width:100%;background:linear-gradient(135deg,var(--plum),var(--plum-br));color:#fff;border:none;border-radius:12px;padding:15px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:9px;transition:.22s;position:relative;margin-top:4px;box-shadow:0 6px 24px rgba(12,110,119,.35)}
.pay:hover{background:linear-gradient(135deg,var(--plum-deep),var(--plum));box-shadow:0 8px 32px rgba(12,110,119,.5)}
.pay:disabled{opacity:.45;pointer-events:none}
.pay.loading{color:transparent;pointer-events:none}
.pay .spin{position:absolute;width:19px;height:19px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:none;animation:spin .7s linear infinite}
.pay.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Transfer / USSD ─── */
.detail-box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-bottom:14px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.drow:last-child{border-bottom:none}
.drow .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
.drow .v{font-family:var(--mono);font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ink)}
.copy{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#8FE3EC;font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;transition:.15s}
.copy:hover{background:rgba(12,110,119,.2);border-color:rgba(12,110,119,.5)}
.ussd-code{text-align:center;font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.04em;background:rgba(12,110,119,.15);border:1px dashed rgba(12,110,119,.5);border-radius:12px;padding:18px;margin-bottom:14px;color:#8FE3EC}

/* ─── Back button ─── */
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;margin-bottom:14px;transition:.15s}
.back:hover{color:#8FE3EC}

/* ─── State screens ─── */
.state{text-align:center;padding:18px 6px}
.state .ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;border:1px solid rgba(255,255,255,.1)}
.ic svg{filter:brightness(2.5) saturate(.95)}
.state h3{font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink)}
.state p{color:var(--ink-soft);font-size:14px;margin-top:8px;max-width:300px;margin-inline:auto}
.spinbig{width:50px;height:50px;border:4px solid rgba(255,255,255,.08);border-top-color:var(--plum-br);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
.otp-boxes{display:flex;gap:9px;justify-content:center;margin:20px 0 14px}
.otp-boxes input{width:42px;height:52px;text-align:center;font-family:var(--mono);font-weight:700;font-size:22px;border:1.5px solid var(--line);border-radius:11px;outline:none;color:var(--ink);background:rgba(255,255,255,.06)}
.otp-boxes input:focus{border-color:rgba(12,110,119,.6);box-shadow:0 0 0 4px rgba(12,110,119,.18);background:rgba(255,255,255,.09)}
.resend{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}
.resend b{color:var(--ink-soft)}
.done-ic{background:var(--mint)!important;color:#fff!important;box-shadow:0 0 40px -8px rgba(31,168,119,.6);border-color:rgba(31,168,119,.4)!important}
.done-ic svg{filter:none!important}
.phone-pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(12,110,119,.5)}50%{box-shadow:0 0 0 10px transparent}}
.receipt{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin:16px 0;text-align:left}

/* ─── Test creds ─── */
.test-creds{background:rgba(224,161,46,.1);border:1px dashed rgba(224,161,46,.35);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px}
.test-creds strong{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--gold);display:block;margin-bottom:6px}
.test-creds .tcrow{display:flex;justify-content:space-between;align-items:center;margin:3px 0}
.test-creds .tcrow span{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.test-creds .tcrow small{color:var(--muted);font-size:10.5px}

/* ─── 3DS splash ─── */
@keyframes ringPulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.07)}}
@keyframes dotBounce{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
.splash-wrap{width:80px;height:80px;position:relative;margin:0 auto 22px}
.splash-ring{position:absolute;inset:-12px;border-radius:50%;border:1.5px solid rgba(12,110,119,.35);animation:ringPulse 1.8s ease-in-out infinite}
.splash-ring-2{inset:-24px;border-color:rgba(12,110,119,.15);animation-delay:.6s}
.splash-ic{width:80px;height:80px;border-radius:50% 50% 48% 48%/60% 60% 40% 40%;background:linear-gradient(135deg,var(--gold),var(--plum-br));box-shadow:inset 0 -4px 8px rgba(0,0,0,.3),0 0 36px rgba(224,161,46,.3);position:relative}
.splash-ic::before{content:'';position:absolute;left:50%;top:18%;bottom:18%;width:3px;background:rgba(255,255,255,.75);transform:translateX(-50%);border-radius:2px}
.splash-dots{display:flex;gap:7px;justify-content:center;margin-top:22px}
.splash-dots span{width:7px;height:7px;background:var(--plum-br);border-radius:50%;animation:dotBounce 1.4s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:.18s}
.splash-dots span:nth-child(3){animation-delay:.36s}

/* ─── Footer ─── */
.co-foot{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.co-foot .lock{display:flex;align-items:center;gap:5px}
.co-foot .pwr{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--ink-soft);font-weight:600}

@media(max-width:480px){.co-name{font-size:16px!important}.co-amt{font-size:30px!important}.field input,.field select{font-size:16px!important}.otp-boxes input{font-size:18px!important;width:38px;height:48px}}
@media(max-width:360px){.otp-boxes{gap:5px!important}.otp-boxes input{width:30px!important;height:42px!important;font-size:16px!important}.co-body{padding:14px 16px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* Replaces inline onmouseover / onfocus handlers so the Content-Security-Policy
   can forbid inline script. Hover and focus are presentation, not behaviour. */
.hv-ink{transition:color .15s}
.hv-ink:hover{color:var(--ink)!important}
.hv-tile{transition:.15s}
.hv-tile:hover{background:rgba(12,110,119,.12)!important;border-color:rgba(12,110,119,.3)!important}
.hv-row{transition:.12s}
.hv-row:hover{background:rgba(255,255,255,.07)!important}
.fx-search:focus{border-color:rgba(12,110,119,.55)!important;box-shadow:0 0 0 3px rgba(12,110,119,.15)!important}
</style>
</head>
<body>

<!-- 3D background -->
<div class="bg-scene">
  <div class="bg-dots"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="checkout">
  <div class="co-head">
    <div class="co-merch">
      <div class="av" id="avLetter">?</div>
      <div><div class="nm" id="merchName">Loading…</div><div class="url">checkout.kassifypay.com</div></div>
      <button id="closeBtn" title="Cancel" style="margin-left:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;transition:.15s;flex-shrink:0" class="hv-ink">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="co-timer" id="timer">14:59</div>
    <div class="co-amt"><span class="l" id="amtLbl">Pay</span><span class="v" id="amtV">₵ 250.00</span></div>
    <div id="amtBreak" style="display:none;margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right"></div>
    <span class="testbadge"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg> TEST MODE</span>
  </div>
  <div class="co-body" id="body"></div>
  <div class="co-foot">
    <span class="lock"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> PCI-DSS secured</span>
    <span class="pwr"><span class="shell"></span>KassifyPay</span>
  </div>
</div>

<script>
"use strict";
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const SYMS={GHS:'₵',NGN:'₦',KES:'KSh',ZAR:'R',USD:'$',EUR:'€',GBP:'£'};
const fmt=(minor,ccy)=>(SYMS[ccy]||(ccy+' '))+' '+(minor/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const S={resends:0,lastPay:null,method:'card',step:'form',provider:'MTN',charge:null,bankDetail:null,ussdDetail:null,threeDsUrl:null,staticAccounts:[],payerName:''};
/* amount() is what the payer pays — the merchant's amount plus the platform
   fee. Every figure on this page quotes it, so the payer is never shown a
   number smaller than what leaves their account. baseAmount/feeAmount are for
   the breakdown under the total. */
const amount=()=>{ if(!S.charge) return 0;
  return Number.isFinite(S.charge.totalAmount)?S.charge.totalAmount:S.charge.amount; };
const baseAmount=()=>S.charge?S.charge.amount:0;
const feeAmount=()=>(S.charge&&S.charge.feeAmount)||0;
const ccy=()=>S.charge?S.charge.currency:'GHS';
/* Shown only when a fee actually applies, so a zero-fee charge is not
   cluttered with a line saying nothing. */
function renderAmountBreakdown(){
  const el=document.getElementById('amtBreak');
  if(!el) return;
  const f=feeAmount();
  if(!f){ el.style.display='none'; return; }
  el.style.display='block';
  el.innerHTML=`${fmt(baseAmount(),ccy())} + ${fmt(f,ccy())} fee`;
}
const merchantName=()=>(S.charge&&S.charge.merchantName)||'KassifyPay';
function getMethods(){
  const c=ccy();
  const hasStatic=S.staticAccounts&&S.staticAccounts.length>0;
  if(c==='NGN'){
    return hasStatic ? [['transfer','Bank transfer']] : [['bank','Bank transfer']];
  }
  /* The MCASH pay-link page offers mobile money networks only. */
  if(c==='GHS') return (PROVIDER==='mcash'&&PAYLINK) ? [['momo','Mobile money']] : [['card','Card'],['momo','Mobile money']];
  const m=[['card','Card']];
  if(hasStatic) m.push(['transfer','Bank transfer']);
  else m.push(['bank','Bank transfer']);
  return m;
}

const API={
  async get(path){const r=await fetch(path);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed.');return d;},
  async post(path,body,hdrs){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',...(hdrs||{})},body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed.');return d;}
};

(function(){let t=899;const e=$('#timer');setInterval(()=>{if(reduce)return;t=Math.max(0,t-1);const m=Math.floor(t/60),s=t%60;e.textContent=m+':'+s.toString().padStart(2,'0');e.style.color=t<120?'var(--coral)':'';},1000);})();

const ICONS={
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>',
  transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>',
  momo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  ussd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14M5 21h14M7 3v18M17 3v18M9 8h6M9 12h6"/></svg>'
};
let TEST_MODE=true;
/* Which processor the server will route this payment through. MCASH is a
   hosted redirect for every method, so the momo form drops the phone step —
   the payer enters their number on MCASH's own page. */
let PROVIDER='mcash';
/* True when live payments go through MCASH's static pay-link (no API keys):
   momo only, the payer enters the amount themselves, and confirmation is
   manual — so the checkout shows the amount + reference to copy across. */
let PAYLINK=false;

function tabs(){
  const m=getMethods();
  if(m.length<=1) return '';
  return `<div class="methods" style="grid-template-columns:repeat(${m.length},1fr)">${m.map(([id,lbl])=>`<button class="mtab ${S.method===id?'on':''}" data-m="${id}"><span class="mi">${ICONS[id]||ICONS.card}</span>${lbl}</button>`).join('')}</div>`;
}
function payBtn(label){return `<button class="pay" id="pay"><span class="spin"></span><span class="lbl">${label}</span></button>`;}

function formFor(m){
  const payLabel='Pay '+fmt(amount(),ccy());
  const info='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>';
  /* Card details are entered on Nalopay's hosted page — deliberately not
     collected here, so no card data ever touches this app. */
  /* MCASH sandbox approvals use a fixed email + verification code. */
  const mcashTestBanner=TEST_MODE&&PROVIDER==='mcash'?`<div class="test-creds">
      <strong>⚡ TEST MODE</strong>
      <div class="tcrow"><span>On the payment page use email <b>test_mode@mail.com</b></span></div>
      <div class="tcrow"><span>Verification code <b>222666</b></span></div>
    </div>`:'';
  if(m==='card') return `
    ${mcashTestBanner}
    <div class="hint">${info}You will be taken to our payment partner's secure page to enter your card details, then returned here.</div>
    ${payBtn('Continue to secure payment')}`;
  if(m==='momo'&&PROVIDER==='mcash') return `
    ${mcashTestBanner}
    <div class="hint">${info}You will be taken to our payment partner's secure page to pay with MTN MoMo, Telecel Cash or AT Money, then returned here.</div>
    ${payBtn('Continue to secure payment')}`;
  if(m==='momo') return `
    ${TEST_MODE?`<div class="test-creds">
      <strong>⚡ TEST — MOBILE MONEY</strong>
      <div class="tcrow"><span>Use any valid 10-digit Ghana number</span></div>
      <div class="tcrow"><span>e.g. 0241234567 (MTN)</span></div>
      <div class="tcrow"><span>Approve the prompt that appears on screen</span></div>
    </div>`:''}

    <div class="field"><label>Network</label></div>
    <div class="seg" id="prov">${['MTN','Telecel','AirtelTigo'].map(p=>`<button data-p="${p}" class="${S.provider===p?'on':''}">${p}</button>`).join('')}</div>
    <div class="field"><label>Mobile money number</label>
      <input class="mono" id="phone" inputmode="numeric" placeholder="024 123 4567" maxlength="13" autocomplete="tel">
      <div class="err" id="phoneErr">Enter a valid 10-digit number</div></div>
    <div class="hint">${info}You will receive a prompt on your phone to approve this payment.</div>
    ${payBtn(payLabel)}`;
  if(m==='bank') return `
    <div class="hint">${info}A one-time virtual bank account will be generated. Transfer the exact amount to complete your payment.</div>
    ${payBtn('Get account number')}`;
  if(m==='transfer') return `
    <div class="hint">${info}Transfer the exact amount to one of the accounts below. Use your payment reference as the narration.</div>
    ${payBtn('View account details')}`;
  if(m==='ussd'){
    const NG_BANKS=[['737','GTBank'],['966','Zenith Bank'],['919','UBA'],['894','First Bank'],['901','Access Bank'],['822','Sterling Bank'],['833','Polaris Bank']];
    return `
    <div class="field">
      <label>Select your bank</label>
      <select id="ussdBank">
        ${NG_BANKS.map(([code,name])=>`<option value="${code}">${name}</option>`).join('')}
      </select>
    </div>
    <div class="hint">${info}You will receive a USSD code to dial on your phone to authorise ${fmt(amount(),ccy())}.</div>
    ${payBtn('Get USSD code')}`;
  }
}

function bindForm(){
  const m=S.method;
  function validateName(){
    const input=$('#payerName');
    if(!input) return true;             // field not rendered (MCASH flow)
    const n=(input.value||'').trim();
    if(!n){const e=$('#payerNameErr');if(e)e.classList.add('show');input.focus();return false;}
    const e=$('#payerNameErr');if(e)e.classList.remove('show');
    S.payerName=n;return true;
  }
  if(m==='card'){
    /* No card fields to bind — the shopper is redirected to Nalopay's page. */
    $('#pay').addEventListener('click',()=>{
      if(!validateName()) return;
      submitPay($('#pay'),'card',{});
    });
  }else if(m==='momo'&&PROVIDER==='mcash'){
    /* Hosted flow — no number to collect here. */
    $('#pay').addEventListener('click',()=>{
      if(!validateName()) return;
      submitPay($('#pay'),'mobile_money',{});
    });
  }else if(m==='momo'){
    $('#prov').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{S.provider=btn.dataset.p;$('#prov').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn));}));
    const phone=$('#phone');
    phone.addEventListener('input',()=>{phone.value=phone.value.replace(/[^\d ]/g,'');phone.classList.remove('bad');$('#phoneErr').classList.remove('show');});
    $('#pay').addEventListener('click',()=>{
      if(!validateName()) return;
      const d=phone.value.replace(/\D/g,'');
      if(d.length<10){phone.classList.add('bad');$('#phoneErr').classList.add('show');return;}
      submitPay($('#pay'),'mobile_money',{phone:d,provider:S.provider});
    });
  }else if(m==='bank'){
    $('#pay').addEventListener('click',()=>{if(!validateName()) return;submitPay($('#pay'),'bank',{});});
  }else if(m==='transfer'){
    $('#pay').addEventListener('click',()=>{if(!validateName()) return;go('static_transfer');});
  }else if(m==='ussd'){
    $('#pay').addEventListener('click',()=>{
      if(!validateName()) return;
      const ussd_type=$('#ussdBank').value;
      submitPay($('#pay'),'ussd',{ussd_type});
    });
  }
}

async function submitPay(btn,method,details){
  btn.classList.add('loading');
  try{
    /* Kept so the prompt can be re-issued without asking for the number
       again. The server mints a fresh Nalopay reference per attempt, so a
       repeat is a genuine second prompt rather than a duplicate of the first. */
    S.lastPay={method,details};
    const {charge,next,detail}=await API.post(`/api/charges/${S.charge.reference}/pay`,{method,...details,payerName:S.payerName});
    S.charge=charge;
    btn.classList.remove('loading');
    handleNext(next,detail);
  }catch(err){
    btn.classList.remove('loading');
    alert(err.message);
  }
}

function handleNext(next,detail){
  if(next==='success')go('success');
  else if(next==='failed')go('failed');
  /* 'otp' and 'pin' were Paystack states. Nalopay has no such step — mobile
     money is approved on the payer's handset and cards are entered on
     Nalopay's hosted page — so these are never returned. */
  else if(next==='bank_details'){S.bankDetail=detail;go('bank');}
  else if(next==='ussd_code'){S.ussdDetail=detail;go('ussd_wait');}
  else if(next==='open_url'&&detail){S.threeDsUrl=detail;go('verify_3ds');}
  /* Nalopay hosted checkout is a full-page redirect — it sets X-Frame-Options,
     so it cannot be framed like the old 3-D Secure step. */
  else if(next==='redirect'&&detail){window.location.href=detail;}
  else if(next==='paylink'&&detail){S.paylinkDetail=detail;go('paylink');}
  else{go('approve');startPolling();}
}

let _poll=null;
/* Polling window, chosen from what actually happens: successful payments
   resolve in a median of 15s, p95 at 56s and p99 at 172s, while failures sit
   at a timeout around 11 minutes. Waiting the old ten minutes therefore showed
   a spinner for nine of them after the outcome was effectively decided.

   Three minutes covers 99.6% of successes. Stopping does NOT abandon the
   charge — it stays open server-side and the Nalopay callback can still settle
   it — it only stops the spinner and hands the payer something to do. */
const POLL_EVERY_MS   = 3500;
const POLL_NUDGE_MS   = 30000;    // p90 of successes is 24s; past that it is not coming
const POLL_STOP_MS    = 180000;   // p99 of successes is 172s

let _pollStarted=0,_pollNudge=null,_pollStop=null;

/* Every screen used to send people to *170#, which is MTN's. A Telecel or
   AirtelTigo payer following that gets nowhere, and those are the two networks
   with the worst completion rates on this gateway. */
const USSD={MTN:'*170#',TELECEL:'*110#',VODAFONE:'*110#',AIRTELTIGO:'*100#',AT:'*100#'};
function ussdFor(p){ return USSD[String(p||'').toUpperCase()]||'*170#'; }
function walletLabel(p){ return String(p||'').toUpperCase()==='MTN' ? 'MyMoney' : 'My Wallet'; }

function clearPollTimers(){
  if(_poll){clearInterval(_poll);_poll=null;}
  if(_pollNudge){clearTimeout(_pollNudge);_pollNudge=null;}
  if(_pollStop){clearTimeout(_pollStop);_pollStop=null;}
}

/* Paying on the MCASH page takes longer than the 3-minute polling window, so
   polling has usually stopped by the time the payer switches back to this
   tab. Coming back restarts it — that moment is exactly when the payment's
   notification is most likely to have arrived. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  if((S.step==='paylink'||S.step==='transfer_sent'||S.step==='approve')&&S.charge&&S.charge.status!=='success'&&S.charge.status!=='failed') startPolling();
});

function startPolling(){
  clearPollTimers();
  _pollStarted=Date.now();

  _poll=setInterval(async()=>{
    try{
      const {charge,next}=await API.get(`/api/charges/${S.charge.reference}/poll`);
      S.charge=charge;
      if(next==='success'||next==='failed'){clearPollTimers();go(next);}
    }catch(e){}
  },POLL_EVERY_MS);

  /* Most people who are going to pay have done so by now. If they have not,
     the likeliest reason is the prompt never arrived. */
  _pollNudge=setTimeout(()=>{
    const el=document.getElementById('pollNudge');
    if(el) el.style.display='block';
    /* Only offered once the first prompt has clearly not landed, and only for
       mobile money — there is nothing to re-send for a card. */
    const rs=document.getElementById('resendPrompt');
    if(rs && S.lastPay && S.lastPay.method==='mobile_money' && S.resends<2) rs.style.display='block';
  },POLL_NUDGE_MS);

  _pollStop=setTimeout(()=>{
    clearPollTimers();
    go('still_waiting');
  },POLL_STOP_MS);
}

/* Resuming gives the payer another full window without creating a new charge,
   so a slow approval is still picked up. */
function resumePolling(){
  go('approve');
  startPolling();
}

function render(){
  const b=$('#body');
  if(!S.charge){b.innerHTML='<div class="state"><div class="spinbig"></div><h3>Loading checkout…</h3></div>';return;}
  if(S.step==='form'){
    const _avail=getMethods();
    if(!_avail.some(([id])=>id===S.method)) S.method=_avail[0][0];
    $('#amtLbl').textContent='Pay '+merchantName();
    $('#amtV').textContent=fmt(amount(),ccy());
    renderAmountBreakdown();
    const _nv=S.payerName?String(S.payerName).replace(/"/g,'&quot;'):'';
    /* MCASH collects the payer's name on its own page, so asking here too was
       pure friction — the field only renders for the other flows. */
    const nameField=PROVIDER==='mcash'?'':`<div class="field" style="margin-top:14px"><label>Full name</label><input id="payerName" type="text" placeholder="Name on your bank account or SIM" autocomplete="name" value="${_nv}"><div class="err" id="payerNameErr">Please enter your full name</div></div>`;
    b.innerHTML=tabs()+nameField+formFor(S.method);
    b.querySelectorAll('.mtab').forEach(t=>t.addEventListener('click',()=>{
      S.payerName=($('#payerName')||{}).value||S.payerName;
      S.method=t.dataset.m;
      /* reset default for momo provider when switching tabs */
      if(S.method==='momo')S.provider='MTN';
      render();
    }));
    bindForm();
  }
  else if(S.step==='approve')b.innerHTML=stateApprove();
  else if(S.step==='still_waiting'){b.innerHTML=stateStillWaiting();bindStillWaiting();}
  else if(S.step==='bank')renderBankDetails(b);
  else if(S.step==='static_transfer')renderStaticTransfer(b);
  else if(S.step==='paylink')renderPaylink(b);
  else if(S.step==='transfer_sent')renderTransferSent(b);
  else if(S.step==='ussd_wait')renderUssdWait(b);
  else if(S.step==='verify_3ds')renderVerify3ds(b);
  else if(S.step==='set-amount')renderSetAmount(b);
  else if(S.step==='success')b.innerHTML=stateSuccess();
  else if(S.step==='failed')b.innerHTML=stateFailed();
}
function go(step){S.step=step;render();}

/* renderOtp and renderPin removed with the Paystack flow. They posted to
   /submit-otp and /submit-pin, which no longer exist, and the PIN screen
   collected a card PIN — not something a merchant page should ever ask for. */

function renderBankDetails(b){
  const a=S.bankDetail||{};
  b.innerHTML=`<div class="detail-box">
    <div class="drow"><span class="k">BANK</span><span class="v">${a.bank_name||'—'}</span></div>
    <div class="drow"><span class="k">ACCOUNT</span><span class="v">${a.account_number||'—'} <button class="copy" data-c="${a.account_number||''}">copy</button></span></div>
    <div class="drow"><span class="k">AMOUNT</span><span class="v">${fmt(amount(),ccy())}</span></div>
  </div>
  <div class="hint" style="justify-content:center"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>Transfer the exact amount above. Waiting for confirmation…</div>`;
  b.querySelectorAll('.copy').forEach(c=>c.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(c.dataset.c).catch(()=>{});c.textContent='copied!';setTimeout(()=>c.textContent='copy',1200);}));
  startPolling();
}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function renderStaticTransfer(b){
  const accs=S.staticAccounts||[];
  const ref=S.charge?S.charge.reference:'—';
  const accsHtml=accs.map((a,i)=>`
    <div class="detail-box" style="${i>0?'margin-top:12px':''}">
      <div class="drow"><span class="k">BANK</span><span class="v">${esc(a.bankName)}</span></div>
      <div class="drow"><span class="k">ACCOUNT</span><span class="v">${esc(a.accountNumber)} <button class="copy" data-c="${esc(a.accountNumber)}">copy</button></span></div>
      <div class="drow"><span class="k">NAME</span><span class="v">${esc(a.accountName)}</span></div>
      <div class="drow"><span class="k">AMOUNT</span><span class="v">${fmt(amount(),ccy())}</span></div>
    </div>`).join('');
  b.innerHTML=`<button class="back" id="back">← Back</button>
    ${accsHtml}
    <div class="detail-box" style="margin-top:12px;background:rgba(12,110,119,.12);border-color:rgba(12,110,119,.3)">
      <div class="drow"><span class="k">REFERENCE</span><span class="v" style="font-family:var(--mono);font-size:12px">${esc(ref)} <button class="copy" data-c="${esc(ref)}">copy</button></span></div>
    </div>
    <div class="hint" style="justify-content:center;flex-direction:column;gap:5px;text-align:center;margin-top:12px">
      <span>Use the reference above as the payment narration / description.</span>
      <span style="color:var(--faint)">Your order will be confirmed once we receive your transfer.</span>
    </div>
    <button class="pay" id="paidBtn" style="margin-top:16px;background:linear-gradient(135deg,#1A9B6E,#15825d)">I've made the payment ✓</button>`;
  b.querySelectorAll('.copy').forEach(c=>c.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(c.dataset.c).catch(()=>{});c.textContent='copied!';setTimeout(()=>c.textContent='copy',1200);}));
  $('#back').addEventListener('click',()=>go('form'));
  $('#paidBtn').addEventListener('click',()=>go('transfer_sent'));
  startPolling();
}

function renderPaylink(b){
  const d=S.paylinkDetail||{};
  const ref=S.charge?S.charge.reference:'—';
  /* The amount the payer must enter is the server's figure, not the charge
     amount — it can carry a few extra pesewas that identify this payment. */
  const disp=d.amountMajor?esc((d.currency||'GHS')+' '+d.amountMajor):fmt(amount(),ccy());
  b.innerHTML=`<button class="back" id="back">← Back</button>
    <div class="detail-box">
      <div class="drow"><span class="k">AMOUNT</span><span class="v">${disp} <button class="copy" data-c="${esc(d.amountMajor||'')}">copy</button></span></div>
      <div class="drow"><span class="k">REFERENCE</span><span class="v" style="font-family:var(--mono);font-size:12px">${esc(ref)} <button class="copy" data-c="${esc(ref)}">copy</button></span></div>
    </div>
    <a href="${esc(d.url||'#')}" target="_blank" rel="noopener" class="pay" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:14px;background:linear-gradient(135deg,#7367f0,#5e50ee)">💳 Pay with MCASH</a>
    <div class="hint" style="justify-content:center;flex-direction:column;gap:5px;text-align:center;margin-top:12px">
      <span>The payment page opens in a new tab. Enter exactly <b>${disp}</b> — this exact figure is how we recognise your payment — and put the reference above in the note / description.</span>
      <span style="color:var(--faint)">Your order will be confirmed once we receive your payment.</span>
    </div>
    <button class="pay" id="paidBtn" style="margin-top:14px;background:linear-gradient(135deg,#1A9B6E,#15825d)">I've made the payment ✓</button>`;
  b.querySelectorAll('.copy').forEach(c=>c.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(c.dataset.c).catch(()=>{});c.textContent='copied!';setTimeout(()=>c.textContent='copy',1200);}));
  $('#back').addEventListener('click',()=>go('form'));
  /* Same manual-confirmation path as static bank transfer: notify the admins,
     show "we'll confirm shortly". Polling keeps running so an admin mark-paid
     flips this page to success while it is still open. */
  $('#paidBtn').addEventListener('click',()=>go('transfer_sent'));
  /* Open MCASH straight away so the payer doesn't need a second tap; the
     button stays as the fallback when a popup blocker eats this. */
  if(d.url){try{window.open(d.url,'_blank','noopener');}catch(e){}}
  startPolling();
}

function renderTransferSent(b){
  /* Notify admin that customer has confirmed they sent funds */
  if(S.charge) fetch(`/api/charges/${encodeURIComponent(S.charge.reference)}/notify-transfer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payerName:S.payerName})}).catch(()=>{});
  const cbUrl=backUrl();
  b.innerHTML=`<div class="state">
    <div class="ic" style="background:#e8f8f1;color:#1A9B6E"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h3>Payment submitted</h3>
    <p>Your transfer of <strong>${fmt(amount(),ccy())}</strong> to ${merchantName()} has been noted. We'll confirm it shortly.</p>
    <p style="font-size:13px;color:var(--faint);margin-top:8px">Returning you to ${merchantName()}…</p>
  </div>`;
  /* Redirect back to merchant site after 2.5 s */
  setTimeout(()=>{ location.href=cbUrl; }, 1500);
}

function renderUssdWait(b){
  const u=S.ussdDetail||{};
  b.innerHTML=`
    <div class="ussd-code">${u.code||'—'}</div>
    <div class="hint" style="justify-content:center;flex-direction:column;gap:6px;text-align:center">
      <span>${u.text||'Dial the code above on your registered phone number to complete payment.'}</span>
      <span style="color:var(--faint)">Waiting for confirmation…</span>
    </div>`;

}

function renderVerify3ds(b){
  b.innerHTML=`
    <div class="state" style="padding:30px 6px 24px">
      <div class="splash-wrap">
        <div class="splash-ring"></div>

  const p=S.provider||'';
  return `<div class="state">
    <div class="ic phone-pulse" style="background:var(--plum-tint);color:var(--plum)"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg></div>
    <h3>Approve on your phone</h3>
    <p>A prompt has been sent to your ${p?p+' ':''}line. Enter your mobile money PIN to authorise ${fmt(amount(),ccy())}.</p>

    <div class="hint" style="justify-content:center;margin-top:14px"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>Waiting for confirmation…</div>
    ${S.charge.ussdCode?`<div style="margin-top:14px;padding:12px 14px;border-radius:11px;background:rgba(12,110,119,.12);border:1px solid rgba(12,110,119,.32);font-size:12.5px;color:var(--ink-soft);line-height:1.6">
      No prompt on your phone? Dial <b style="font-family:var(--mono);font-size:14px;color:var(--ink)">${esc(S.charge.ussdCode)}</b> to approve it yourself.

    <div id="pollNudge" style="display:none;margin-top:16px;padding:12px 14px;border-radius:11px;background:rgba(224,161,46,.1);border:1px solid rgba(224,161,46,.28);font-size:12.5px;color:#E0A12E;line-height:1.55">
      <b>Haven't received the prompt?</b> The commonest reason is not enough money in the wallet — it needs <b>${fmt(amount(),ccy())}</b> available. Check your balance, then dial <b style="font-family:var(--mono)">${ussdFor(p)}</b> and choose "${walletLabel(p)}" to approve a pending payment.
    </div>
    <button class="back" id="resendPrompt" style="display:none;margin-top:12px">Send the prompt again</button>
  </div>`;
}

/* Reached when the poll window closes without an outcome. The charge is still
   open — the gateway callback can settle it after this — so the wording says
   "not confirmed yet", never "failed". Checking again resumes polling rather
   than creating a second charge. */
function stateStillWaiting(){
  return `<div class="state">
    <div class="ic" style="background:rgba(224,161,46,.14);color:#E0A12E"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
    <h3>Not confirmed yet</h3>
    <p>We haven't had confirmation for your ${fmt(amount(),ccy())} payment. If you approved the prompt it may still come through — check again below.</p>
    <div style="margin-top:16px;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);line-height:1.6;text-align:left">
      Didn't see a prompt? Dial <b style="font-family:var(--mono)">${ussdFor(S.provider)}</b>, choose <b>${walletLabel(S.provider)}</b>, then <b>Approve payment</b>. If your balance is under ${fmt(amount(),ccy())} the prompt will not arrive at all — top up and try again, or use a different number.
    </div>
    <button class="pay" id="swCheck" style="margin-top:16px"><span class="spin"></span><span class="lbl">Check again</span></button>
    <button class="back" id="swRestart" style="margin-top:10px">← Try another method</button>
  </div>`;
}

function bindStillWaiting(){
  const c=document.getElementById('swCheck');
  if(c) c.addEventListener('click',()=>{ c.classList.add('loading'); resumePolling(); });
  const r=document.getElementById('swRestart');
  if(r) r.addEventListener('click',()=>{ clearPollTimers(); go('form'); });
}

function stateSuccess(){
  clearPollTimers();   // also cancels the nudge and stop timers
  $('#amtLbl').textContent='Paid to '+merchantName();
  const ch=S.charge.auth&&S.charge.auth.channel;
  const ML={card:'Card',mobile_money:'Mobile money',bank_transfer:'Bank transfer',ussd:'USSD'};
  const methodLabel=ML[ch||S.charge.method]||S.charge.method||'—';
  const cbUrl=backUrl();
  setTimeout(()=>{ location.href=cbUrl; }, 1500);
  return `<div class="state">
    <div class="ic done-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h3>Payment successful</h3><p>Your payment of ${fmt(amount(),ccy())} to ${merchantName()} is complete.</p>
    <div class="receipt">
      <div class="drow"><span class="k">REFERENCE</span><span class="v">${S.charge.reference}</span></div>
      <div class="drow"><span class="k">METHOD</span><span class="v">${methodLabel}</span></div>
      <div class="drow"><span class="k">AMOUNT</span><span class="v" style="color:var(--mint)">${fmt(amount(),ccy())}</span></div>
    </div>
    <p style="font-size:13px;color:var(--faint);margin-top:4px">Returning you to ${merchantName()}…</p>
    <button class="pay" id="ret">Return to ${merchantName()}</button>
  </div>`;
}

function stateFailed(){
  clearPollTimers();   // also cancels the nudge and stop timers
  const f=S.charge.failure||{message:'Your payment could not be processed.'};
  return `<div class="state">
    <div class="ic" style="background:var(--coral-tint);color:var(--coral)"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div>
    <h3>Payment not completed</h3><p>${f.message}</p>
    <div style="margin-top:14px;padding:13px 15px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);line-height:1.65;text-align:left">
      <div style="font-weight:700;margin-bottom:7px;color:var(--ink)">The usual reasons</div>
      • Not enough in the wallet — it needs <b>${fmt(amount(),ccy())}</b> available.<br>
      • The prompt was not approved in time. Dial <b style="font-family:var(--mono)">${ussdFor(S.provider)}</b> → <b>${walletLabel(S.provider)}</b> to approve a pending payment.<br>
      • The amount is above what your network allows in one payment.
    </div>
    <button class="pay" id="retry" style="margin-top:12px">Try again</button>
    <button class="back" id="retryOther" style="margin-top:10px">← Use another number or network</button>
  </div>`;
}

function renderSetAmount(b){
  const c=S.charge;
  const sym=SYMS[c.currency]||(c.currency+' ');
  $('#amtLbl').textContent='Payment to '+merchantName();
  $('#amtV').textContent='—';
  b.innerHTML=`
    <div class="state" style="padding:20px 0 12px">
      <div class="ic" style="background:var(--plum-tint);color:var(--plum)">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6"/>
        </svg>
      </div>
      <h3>Enter amount</h3>
      <p style="margin-top:6px">How much would you like to pay?</p>
    </div>
    <div class="field" style="margin-top:4px">
      <label>${sym} Amount (${c.currency})</label>
      <input type="number" id="openAmt" min="1" step="0.01" placeholder="0.00" style="font-size:22px;text-align:center;padding:14px">
      <div class="err" id="openAmtErr">Enter a valid amount (minimum 1)</div>
    </div>
    <button class="pay" id="setAmtBtn"><span class="spin"></span><span class="lbl">Continue to payment →</span></button>`;
  const inp=$('#openAmt');
  const btn=$('#setAmtBtn');
  const errEl=$('#openAmtErr');
  inp.focus();
  inp.addEventListener('input',()=>{inp.classList.remove('bad');errEl.classList.remove('show');});
  btn.addEventListener('click',async()=>{
    const val=Number(inp.value);
    if(!val||val<1){inp.classList.add('bad');errEl.classList.add('show');return;}
    btn.classList.add('loading');
    try{
      const {charge}=await API.post(`/api/charges/${c.reference}/set-amount`,{amount:val});
      S.charge=charge;
      go('form');
    }catch(err){
      btn.classList.remove('loading');
      errEl.textContent=err.message;
      errEl.classList.add('show');
    }
  });
}

function routeFromCharge(){
  updateMerchantDisplay();
  const st=S.charge.status;
  if(st==='success')go('success');
  else if(st==='failed')go('failed');
  else if(S.charge.openAmount)go('set-amount');
  else go('form');
}

async function boot(){
  const infoP=API.get('/api/info').then(d=>{TEST_MODE=d.testMode!==false;if(d.provider)PROVIDER=d.provider;PAYLINK=!!d.paylink;}).catch(()=>{});
  const params=new URLSearchParams(location.search);
  const ref=params.get('reference');
  try{
    if(ref){
      try{
        const {charge}=await API.get('/api/charges/'+encodeURIComponent(ref));
        S.charge=charge;
        /* Returning from the hosted checkout page (Nalopay or MCASH). Neither
           puts a status in the query, so always re-verify when a session was
           started and the charge is still open. For MCASH the poll simply
           picks up whatever the signed IPN has already settled. */
        if((charge.nalopayRef||charge.mcashRef||charge.mcashPaylink)&&charge.status!=='success'&&charge.status!=='failed'){
          try{const {charge:v}=await API.get('/api/charges/'+encodeURIComponent(ref)+'/verify');S.charge=v;}catch(e){}
          if(S.charge.status!=='success'&&S.charge.status!=='failed'){startPolling();}
        }
      }catch(e){
        $('#body').innerHTML=`<div class="state">
          <div class="ic" style="background:var(--gold-tint);color:var(--gold-deep)"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg></div>
          <h3>Payment link expired</h3>
          <p>This payment link is no longer valid. Please contact the merchant for a new link.</p>
        </div>`;
        return;
      }
    }else{
      $('#body').innerHTML=`<div class="state">
        <div class="ic" style="background:var(--gold-tint);color:var(--gold-deep)"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg></div>
        <h3>No payment link</h3>
        <p>Please use a valid payment link to continue.</p>
      </div>`;
      return;
    }
  }catch(err){
    $('#body').innerHTML=`<div class="state"><h3>Couldn't start checkout</h3><p>${err.message}</p></div>`;
    return;
  }
  await infoP;
  if(!TEST_MODE){const tb=document.querySelector('.testbadge');if(tb)tb.style.display='none';}
  /* Pre-fetch static bank accounts for the charge currency */
  if(S.charge){
    try{
      const {accounts}=await API.get('/api/bank-accounts?currency='+encodeURIComponent(ccy()));
      S.staticAccounts=accounts||[];
    }catch(e){ S.staticAccounts=[]; }
  }
  routeFromCharge();
}

function updateMerchantDisplay(){
  const name=merchantName();
  const nm=document.getElementById('merchName');
  const av=document.getElementById('avLetter');
  if(nm)nm.textContent=name;
  if(av)av.textContent=name.charAt(0).toUpperCase();
  document.title='KassifyPay Checkout — '+name;
}


/* Best URL to send the customer back to the merchant site */
const backUrl=()=>(S.charge&&(S.charge.callbackUrl||S.charge.merchantWebsite))||document.referrer||'/';

document.getElementById('closeBtn').addEventListener('click',()=>{ location.href=backUrl(); });

document.addEventListener('click',e=>{
  if(e.target&&e.target.id==='ret'){ location.href=backUrl(); }
  if(e.target&&e.target.id==='resendPrompt'){
    /* Two live prompts can both be approved, and that is two debits. The payer
       is told plainly rather than finding out afterwards. */
    if(!confirm('Send a new prompt to the same number?\n\nOnly do this if nothing arrived. If the first prompt does show up later, do not approve both \u2014 you would be charged twice.')) return;
    const b=e.target; b.disabled=true; b.textContent='Sending\u2026';
    S.resends++;
    submitPay(b,S.lastPay.method,S.lastPay.details);
    return;
  }
  if(e.target&&e.target.id==='retryOther'){ clearPollTimers(); go('form'); return; }
  if(e.target&&e.target.id==='retry'){
    S.charge.status='pending';
    S.charge.failure=null;
    go('form');
  }
});
boot();
</script>
</body>
</html>
